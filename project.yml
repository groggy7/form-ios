name: FormApp
options:
  bundleIdPrefix: com.perseverancesoftware
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
schemes:
  FormApp:
    build:
      targets:
        FormApp: all
        FormAppTests: [test]
    test:
      targets:
        - FormAppTests
    run:
      config: Debug
  FormWatch:
    build:
      targets:
        FormWatch: all
    run:
      config: Debug
targets:
  FormApp:
    type: application
    platform: iOS
    sources:
      - path: FormApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perseverancesoftware.forcedrep
        PRODUCT_NAME: FormApp
        INFOPLIST_FILE: FormApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Every other app icon set becomes a founder alternate (docs/design/launcher-icon.md#alternate-app-icons).
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOCALIZATION_STRINGS: NO
        CODE_SIGN_ENTITLEMENTS: FormApp/FormApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D38SU6U4FN
    dependencies:
      - target: FormRestWidget
        embed: true
      # Embedded in "Embed Watch Content" (docs/apple-watch.md).
      - target: FormWatch
  FormWatch:
    type: application
    platform: watchOS
    sources:
      - path: FormWatch
      - path: FormApp/Watch/WatchSync.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perseverancesoftware.forcedrep.watchkitapp
        PRODUCT_NAME: FormWatch
        INFOPLIST_FILE: FormWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: FormWatch/FormWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOCALIZATION_STRINGS: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D38SU6U4FN
  FormRestWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FormRestWidget
      - path: FormApp/Models/RestActivityAttributes.swift
      - path: FormApp/Views/Components/RestActivityContent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perseverancesoftware.forcedrep.rest
        PRODUCT_NAME: FormRestWidget
        INFOPLIST_FILE: FormRestWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D38SU6U4FN
  FormAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FormAppTests
      - path: FormApp/Resources/StarterPrograms
    dependencies:
      - target: FormApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perseverancesoftware.forcedrep.tests
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOCALIZATION_STRINGS: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D38SU6U4FN
