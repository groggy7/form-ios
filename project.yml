name: FormApp
options:
  bundleIdPrefix: com.form.gym
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
schemes:
  FormApp:
    build:
      targets:
        FormApp: all
        FormAppTests: [test]
    test:
      targets:
        - FormAppTests
    run:
      config: Debug
targets:
  FormApp:
    type: application
    platform: iOS
    sources:
      - path: FormApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.form.gym.ios
        PRODUCT_NAME: FormApp
        INFOPLIST_FILE: FormApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
  FormAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FormAppTests
    dependencies:
      - target: FormApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.form.gym.ios.tests
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
